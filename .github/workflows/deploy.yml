name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 照片仓库 push 后通过 repository_dispatch 触发
  repository_dispatch:
    types: [photos-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APP_BASE_PATH: /afilmory/
    steps:
      - uses: actions/checkout@v4

      - name: Checkout photos
        uses: actions/checkout@v4
        with:
          repository: csh1314/afilmory-photos
          token: ${{ secrets.PHOTOS_TOKEN }}
          path: .photos-src

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # manifest 与缩略图不入库，靠缓存实现增量构建
      - uses: actions/cache@v4
        with:
          path: |
            apps/web/src/data/photos-manifest.json
            apps/web/public/thumbnails
          key: photos-manifest-${{ github.run_id }}
          restore-keys: photos-manifest-

      - run: sh scripts/sync-photos.sh .photos-src

      # 先跑 builder 生成 manifest/缩略图，再 vite build
      - run: pnpm --filter web build

      - name: SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
